
name: Daily SEO Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: seo-automation-511610
          workload_identity_provider: projects/470659248808/locations/global/workloadIdentityPools/github-seo-automation/providers/github-actions
          service_account: seo-gsc-reader@seo-automation-511610.iam.gserviceaccount.com

      - name: Extract starter kit
        run: |
          mkdir -p starter reports
          unzip -o seo-automation-starter.zip -d starter

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r starter/requirements.txt

      - name: Run read-only SEO audit
        run: |
          python starter/seo_audit.py \
            --config starter/config/sites.json \
            --out reports

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit-report
          path: reports/
          if-no-files-found: warn
          retention-days: 30
          
